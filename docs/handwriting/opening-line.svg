<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150">
  <text x="360" y="34" text-anchor="middle" font-family="Hannotate SC, HanziPen SC, Kaiti SC, STKaiti, cursive" font-size="25" fill="#4b5563">读研的日子过得很快。快到一恍惚，一周就没了；</text>
  <text x="360" y="76" text-anchor="middle" font-family="Hannotate SC, HanziPen SC, Kaiti SC, STKaiti, cursive" font-size="25" fill="#4b5563">忙到晚上躺下，想不起今天到底推进了什么。</text>
